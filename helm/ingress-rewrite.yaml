apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: other-to-extra
  namespace: learning
spec:
  replacePathRegex:
    regex: '^/other(/.*|$)'
    replacement: '/extra${1}'
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-extra-rewrite
  namespace: learning
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: learning-other-to-extra@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: api.demo.test
      http:
        paths:
          - path: /other
            pathType: Prefix
            backend:
              service:
                name: demo-extra
                port:
                  number: 80