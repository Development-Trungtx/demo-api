# Specify the controller to handle, this case in Traefik
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: traefik-lab
spec:
  controllerName: traefik.io/gateway-controller
---
# Declare input HTTP/HTTPS
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: demo-gateway
  namespace: learning
spec:
  gatewayClassName: traefik-lab
  listeners:
    - name: http
      protocol: HTTP
      port: 8000
      allowedRoutes:
        namespaces:
          from: Same
---
# Declare hostname/path and Service đích
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: demo-api-route
  namespace: learning
spec:
  parentRefs:
    - name: demo-gateway
      sectionName: http
  hostnames:
    - gateway.demo.test
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /test
      backendRefs:
        - name: demo-api
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /extra
      backendRefs:
        - name: demo-extra
          port: 80