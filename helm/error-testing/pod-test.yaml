apiVersion: v1
kind: Pod
metadata:
  name: memory-limit-demo
  namespace: learning
spec:
  restartPolicy: Never
  containers:
    - name: stress
      image: polinux/stress
      command: ["stress"]
      args: ["--vm", "1", "--vm-bytes", "250M", "--vm-hang", "1"]
      resources:
        requests:
          cpu: "100m"
          memory: "50Mi"
        limits:
          cpu: "500m"
          memory: "100Mi"