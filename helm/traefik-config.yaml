apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    providers:
      kubernetesCRD:
        enabled: true
      kubernetesIngress:
        enabled: true
      kubernetesGateway:
        enabled: true

    gateway:
      enabled: false

    gatewayClass:
      enabled: false